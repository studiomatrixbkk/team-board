<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTRX Popup Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a0f2e;--ease:cubic-bezier(.16,1,.3,1);--back:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050817;font-family:'Inter Tight','IBM Plex Sans Thai',system-ui,sans-serif;color:#f4f6ff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bgBoard{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0}
#bgPlain{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(1200px 800px at 15% 0%,#1f3fff55,transparent 60%),radial-gradient(900px 700px at 100% 100%,#ff6a1a33,transparent 60%),#050817}

/* ================= POP: "ทะลุมิติ" overlay ================= */
.pop{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
.pop svg{overflow:visible}
.pop .lines{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;animation:popLines 5.4s linear both}
@keyframes popLines{0%{opacity:0;transform:scale(1.25)}7%{opacity:.42;transform:scale(1)}80%{opacity:.3;transform:scale(1.03)}92%{opacity:0;transform:scale(.9)}100%{opacity:0}}
.pop .lines polygon{fill:var(--c1)}

.pop .band{position:absolute;left:-80px;right:-80px;top:478px;height:250px;transform:translateX(-115%) skewX(-14deg);
  background:linear-gradient(90deg,var(--c1),var(--c2));animation:popBand 5.4s var(--ease) both;overflow:hidden}
.pop .band::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.16) 3px,rgba(255,255,255,0) 3px,rgba(255,255,255,0) 14px)}
.pop .band::after{content:'';position:absolute;left:0;right:0;top:14px;bottom:14px;border-top:4px solid rgba(255,255,255,.75);border-bottom:4px solid rgba(255,255,255,.75)}
.pop.k-urgent .band::before{background:repeating-linear-gradient(-45deg,rgba(10,15,46,.38) 0,rgba(10,15,46,.38) 26px,rgba(255,255,255,0) 26px,rgba(255,255,255,0) 52px)}
@keyframes popBand{0%{transform:translateX(-115%) skewX(-14deg)}12%{transform:translateX(0) skewX(-14deg)}84%{transform:translateX(0) skewX(-14deg)}96%,100%{transform:translateX(115%) skewX(-14deg)}}

.pop .flash{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(700px 500px at 520px 600px,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);opacity:0;animation:popFlash 5.4s linear both}
@keyframes popFlash{0%{opacity:0}2%{opacity:.85}9%{opacity:0}91%{opacity:0}94%{opacity:.7}100%{opacity:0}}

/* portal */
.pop .portal{position:absolute;left:300px;top:380px;width:440px;height:440px;transform:scale(0);animation:popPortal 5.4s var(--ease) both}
@keyframes popPortal{0%{transform:scale(0) rotate(-90deg)}9%{transform:scale(1.12) rotate(0)}13%{transform:scale(1)}88%{transform:scale(1)}96%,100%{transform:scale(0) rotate(120deg)}}
.pop .portal svg{width:440px;height:440px}
.pop .spin1,.pop .spin2,.pop .spin3,.pop .warp{transform-box:fill-box;transform-origin:center}
.pop .spin1{animation:spin 2.2s linear infinite}
.pop .spin2{animation:spin 1.6s linear infinite reverse}
.pop .spin3{animation:spin 4s linear infinite}
.pop .warp{animation:warp .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes warp{0%{transform:scale(.15);opacity:0}30%{opacity:1}100%{transform:scale(1.5);opacity:0}}

/* actor = bot + card + burst; shakes on impact */
.pop .actor{position:absolute;left:0;top:0;width:1920px;height:1080px;animation:popShake 5.4s linear both}
@keyframes popShake{0%,16%{transform:translate(0,0)}17%{transform:translate(-10px,6px)}18%{transform:translate(9px,-7px)}19%{transform:translate(-6px,4px)}20%{transform:translate(4px,-2px)}21%,100%{transform:translate(0,0)}}

/* robot */
.pop .bot{position:absolute;left:400px;top:470px;width:240px;height:280px;transform:scale(.05) rotate(-200deg);animation:popBot 5.4s both}
@keyframes popBot{
  0%,6%{transform:scale(.05) rotate(-200deg);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  14%{transform:scale(1.22,.82) rotate(0)}
  17%{transform:scale(.9,1.12)}
  20%{transform:scale(1.04,.97)}
  23%,86%{transform:scale(1)}
  95%,100%{transform:scale(0) rotate(300deg)}}
.pop .bot .bob{width:240px;height:280px;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-8px) rotate(-3deg)}to{transform:translateY(8px) rotate(3deg)}}
.pop .bot svg{width:240px;height:280px}
.pop .eyes{transform-box:fill-box;transform-origin:center;animation:blink 2.6s 1.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pop .jet{transform-box:fill-box;transform-origin:50% 0;animation:jet .12s linear infinite alternate}
@keyframes jet{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.pop .acc{display:none}
.pop.k-urgent .siren,.pop.k-review .lens,.pop.k-done .happy,.pop.k-approved .happy,.pop.k-new .star{display:block}
.pop.k-done .eyes,.pop.k-approved .eyes{display:none}
.pop .siren .lamp{animation:siren .35s steps(1) infinite}
@keyframes siren{0%{opacity:1}50%{opacity:.25}}
.pop .arm{transform-box:fill-box;transform-origin:15% 50%;animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}

/* comic card */
.pop .card{position:absolute;left:660px;top:492px;width:880px;height:222px;border-radius:30px;background:#f8f9ff;border:7px solid var(--navy);
  box-shadow:14px 14px 0 var(--navy);transform:scaleX(0);transform-origin:0 50%;animation:popCard 5.4s both;color:var(--navy);padding:22px 34px 0 40px;overflow:hidden}
@keyframes popCard{0%,11%{transform:scaleX(0) rotate(-4deg)}17%{transform:scaleX(1.06) rotate(1deg)}20%{transform:scaleX(.98) rotate(0)}22%,84%{transform:scaleX(1)}90%,100%{transform:scaleX(0) rotate(4deg)}}
.pop .card::before{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--c1),rgba(255,255,255,0) 70%);opacity:.22}
.pop .tag{display:inline-block;padding:6px 20px 7px;border-radius:12px;background:var(--c1);color:#fff;font-size:30px;font-weight:900;letter-spacing:.02em;border:4px solid var(--navy);
  transform:translateY(20px);opacity:0;animation:popIn .5s .95s var(--back) both}
.pop .ttl{font-size:66px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;animation:popIn .5s 1.08s var(--back) both}
.pop .ttl b{color:var(--c1);-webkit-text-stroke:2px var(--navy);margin-right:14px}
.pop .sub{font-size:28px;font-weight:700;color:#3a4170;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;opacity:0;animation:popIn .5s 1.2s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* POW burst */
.pop .burst{position:absolute;left:1390px;top:360px;width:260px;height:260px;transform:scale(0);animation:popBurst 5.4s both}
@keyframes popBurst{0%,14%{transform:scale(0) rotate(-40deg)}19%{transform:scale(1.18) rotate(6deg)}23%{transform:scale(1) rotate(0)}84%{transform:scale(1)}90%,100%{transform:scale(0) rotate(30deg)}}
.pop .burst svg{position:absolute;left:0;top:0;width:260px;height:260px}
.pop .burst .rays{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.pop .burst b{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:56px;font-weight:900;color:#fff;letter-spacing:-.02em;
  -webkit-text-stroke:3px var(--navy);transform:rotate(-10deg);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(-10deg) scale(1.1)}}

/* sparks */
.pop .sparks i{position:absolute;left:660px;top:600px;width:16px;height:16px;border:3px solid var(--navy);border-radius:4px;opacity:0;
  animation:spark 1s .82s cubic-bezier(.1,.8,.3,1) both}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6)}}

/* the page itself gets pulled toward the portal ("ทะลุมิติ"), then springs back */
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:520px 600px}
#world.warp{animation:worldWarp 5.4s var(--ease) both}
@keyframes worldWarp{
  0%{transform:none}
  4%{transform:perspective(1600px) rotateY(-3deg) scale(1.03)}
  13%{transform:perspective(1600px) rotateY(10deg) rotateX(3deg) scale(.88) translateX(60px)}
  18%{transform:perspective(1600px) rotateY(7deg) rotateX(2deg) scale(.9) translateX(46px)}
  86%{transform:perspective(1600px) rotateY(7deg) rotateX(2deg) scale(.9) translateX(46px)}
  94%{transform:perspective(1600px) rotateY(-2deg) scale(1.02)}
  100%{transform:none}}
.vignette{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:40;opacity:0;
  background:radial-gradient(900px 700px at 520px 600px,rgba(5,8,23,0) 30%,rgba(5,8,23,.78) 100%)}
.vignette.on{animation:vig 5.4s linear both}
@keyframes vig{0%{opacity:0}10%{opacity:1}86%{opacity:1}96%,100%{opacity:0}}

/* lab UI */
.ui{position:absolute;left:24px;bottom:22px;z-index:99;display:flex;flex-wrap:wrap}
.ui button{margin:0 10px 10px 0;font:700 22px 'Inter Tight','IBM Plex Sans Thai',sans-serif;padding:12px 20px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(10,15,46,.85);color:#fff;cursor:pointer}
.ui button.on{background:#ff7a1a;border-color:#ff7a1a}
.hide-ui .ui{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgPlain"></div>
  <div id="world"><iframe id="bgBoard" src="index.html" title="board"></iframe></div>
  <div class="vignette" id="vig"></div>
  <div class="ui">
    <button data-k="done">✓ เสร็จแล้ว</button>
    <button data-k="urgent">🔥 งานด่วน</button>
    <button data-k="new">＋ งานใหม่</button>
    <button data-k="review">👁 ส่งตรวจ</button>
    <button data-k="approved">✓ ผ่านตรวจ</button>
    <button id="auto" class="on">▶ เล่นวน</button>
  </div>
</div>
<script>
/* ===== fit 1920x1080 to the screen ===== */
var lastVP = '';
function fit() {
  var d = document.documentElement, w = d.clientWidth || innerWidth, h = d.clientHeight || innerHeight;
  if (!w || !h || w + 'x' + h === lastVP) return; lastVP = w + 'x' + h;
  var s = Math.min(w / 1920, h / 1080);
  document.getElementById('stage').style.transform = 'translate(' + (w - 1920 * s) / 2 + 'px,' + (h - 1080 * s) / 2 + 'px) scale(' + s + ')';
}
addEventListener('resize', fit); setInterval(fit, 1000); fit();
var P = new URLSearchParams(location.search);
if (P.get('ui') === '0') document.body.className = 'hide-ui';
if (P.get('board') === '0') document.getElementById('bgBoard').style.display = 'none';

/* ===== the popup ===== */
var POP_KINDS = {
  done:     { c1: '#3ee0b0', c2: '#ff7a1a', tag: 'เสร็จแล้ว!',  burst: 'YEAH!' },
  urgent:   { c1: '#ff4d6d', c2: '#ff7a1a', tag: 'งานด่วน!',    burst: '!!' },
  'new':    { c1: '#4f7bff', c2: '#8fb3ff', tag: 'งานใหม่!',     burst: 'NEW!' },
  review:   { c1: '#7b5cff', c2: '#b49cff', tag: 'ส่งตรวจ!',     burst: 'CHECK!' },
  approved: { c1: '#3ee0b0', c2: '#8fb3ff', tag: 'ผ่านตรวจ!',   burst: 'PASS!' }
};
var POP_MS = 5600, popQ = [], popBusy = false;
function popEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

var POP_LINES = (function () {           // manga focus lines centred on the portal
  var cx = 520, cy = 600, out = '', n = 46;
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2 + (i % 2 ? .03 : 0), w1 = .004, w2 = .016 + (i % 3) * .006, r1 = 300 + (i % 4) * 40, r2 = 1500;
    var p = function (r, t) { return (cx + Math.cos(t) * r).toFixed(1) + ',' + (cy + Math.sin(t) * r).toFixed(1); };
    out += '<polygon points="' + p(r1, a - w1) + ' ' + p(r2, a - w2) + ' ' + p(r2, a + w2) + ' ' + p(r1, a + w1) + '"/>';
  }
  return out;
})();
var POP_BURST = (function () {           // comic starburst
  var pts = [], n = 18;
  for (var i = 0; i < n * 2; i++) { var r = i % 2 ? 84 : 128 + (i % 4 === 0 ? 0 : -14), t = (i / (n * 2)) * Math.PI * 2; pts.push((130 + Math.cos(t) * r).toFixed(1) + ',' + (130 + Math.sin(t) * r).toFixed(1)); }
  return pts.join(' ');
})();
var POP_WARP = (function () {            // stars streaking out of the portal
  var s = '';
  for (var i = 0; i < 20; i++) { var t = i / 20 * Math.PI * 2, r1 = 20, r2 = 34 + (i % 3) * 10; s += '<line x1="' + (220 + Math.cos(t) * r1).toFixed(1) + '" y1="' + (220 + Math.sin(t) * r1).toFixed(1) + '" x2="' + (220 + Math.cos(t) * r2).toFixed(1) + '" y2="' + (220 + Math.sin(t) * r2).toFixed(1) + '"/>'; }
  return s;
})();

function popBotSVG() {
  return '<svg viewBox="0 0 240 280">' +
    // jet flame
    '<g class="jet"><path d="M96 228 Q120 300 144 228 Z" fill="#ffb347" stroke="#0a0f2e" stroke-width="6" stroke-linejoin="round"/><path d="M108 228 Q120 270 132 228 Z" fill="#fff"/></g>' +
    // antenna + pixel mark
    '<line x1="120" y1="40" x2="120" y2="14" stroke="#0a0f2e" stroke-width="7" stroke-linecap="round"/>' +
    '<g transform="translate(106,-2)"><rect x="0" y="0" width="9" height="9" fill="#fff"/><rect x="19" y="0" width="9" height="9" fill="#fff"/><rect x="9.5" y="9.5" width="9" height="9" fill="#fff"/><rect x="0" y="19" width="9" height="9" fill="#fff"/><rect x="19" y="19" width="9" height="9" fill="#fff"/></g>' +
    // siren (urgent)
    '<g class="acc siren"><rect x="96" y="2" width="48" height="30" rx="12" fill="#ff4d6d" stroke="#0a0f2e" stroke-width="6" class="lamp"/><rect x="88" y="28" width="64" height="12" rx="5" fill="#0a0f2e"/></g>' +
    // body
    '<rect x="26" y="40" width="188" height="192" rx="58" fill="url(#botG)" stroke="#0a0f2e" stroke-width="8"/>' +
    '<defs><linearGradient id="botG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7bff"/><stop offset="1" stop-color="#2440d8"/></linearGradient></defs>' +
    '<path d="M50 70 Q60 52 84 50" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>' +
    // face screen
    '<rect x="50" y="76" width="140" height="96" rx="34" fill="#0a0f2e"/>' +
    '<g class="eyes"><ellipse cx="92" cy="122" rx="16" ry="20" fill="#fff"/><ellipse cx="148" cy="122" rx="16" ry="20" fill="#fff"/>' +
    '<circle cx="95" cy="127" r="8" fill="#0a0f2e"/><circle cx="151" cy="127" r="8" fill="#0a0f2e"/><circle cx="99" cy="120" r="3.5" fill="#fff"/><circle cx="155" cy="120" r="3.5" fill="#fff"/></g>' +
    '<g class="acc happy"><path d="M76 128 Q92 106 108 128" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M132 128 Q148 106 164 128" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/></g>' +
    '<path d="M108 150 Q120 162 132 150" stroke="#ff7a1a" stroke-width="6" fill="none" stroke-linecap="round"/>' +
    '<circle cx="66" cy="152" r="8" fill="#ff7a1a" opacity=".55"/><circle cx="174" cy="152" r="8" fill="#ff7a1a" opacity=".55"/>' +
    // arms (right arm waves toward the card)
    '<rect x="2" y="150" width="34" height="22" rx="11" fill="#2440d8" stroke="#0a0f2e" stroke-width="6"/>' +
    '<g class="arm"><rect x="204" y="132" width="44" height="22" rx="11" fill="#2440d8" stroke="#0a0f2e" stroke-width="6"/></g>' +
    // accessories
    '<g class="acc lens"><circle cx="40" cy="196" r="26" fill="rgba(255,255,255,.35)" stroke="#0a0f2e" stroke-width="7"/><line x1="58" y1="214" x2="76" y2="236" stroke="#0a0f2e" stroke-width="10" stroke-linecap="round"/></g>' +
    '<g class="acc star"><path d="M196 34 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#ffd166" stroke="#0a0f2e" stroke-width="5" stroke-linejoin="round"/></g>' +
    '</svg>';
}

function popPortalSVG() {
  return '<svg viewBox="0 0 440 440">' +
    '<defs><radialGradient id="voidG"><stop offset="0" stop-color="#050817"/><stop offset=".6" stop-color="#0b1440"/><stop offset="1" stop-color="var(--c1)"/></radialGradient></defs>' +
    '<circle cx="220" cy="220" r="150" fill="url(#voidG)"/>' +
    '<g class="warp" stroke="#fff" stroke-width="4" stroke-linecap="round">' + POP_WARP + '</g>' +
    '<g class="spin1"><circle cx="220" cy="220" r="168" fill="none" stroke="var(--c1)" stroke-width="14" stroke-dasharray="60 22"/></g>' +
    '<g class="spin2"><circle cx="220" cy="220" r="146" fill="none" stroke="var(--c2)" stroke-width="7" stroke-dasharray="14 16"/></g>' +
    '<g class="spin3"><circle cx="220" cy="220" r="196" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="3 26" stroke-linecap="round"/></g>' +
    '<circle cx="220" cy="220" r="176" fill="none" stroke="#0a0f2e" stroke-width="6"/>' +
    '</svg>';
}

function mtrxPop(o) { popQ.push(o); if (!popBusy) nextPop(); }
function nextPop() {
  var o = popQ.shift();
  if (!o) { popBusy = false; return; }
  popBusy = true;
  var k = POP_KINDS[o.kind] || POP_KINDS.done;
  var sparks = '', cols = ['#fff', '#ffb347', '#8fb3ff', '#3ee0b0', k.c1];
  for (var i = 0; i < 26; i++) {
    var a = Math.random() * Math.PI * 2, d = 160 + Math.random() * 320;
    sparks += '<i style="background:' + cols[i % cols.length] + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d * .7) + 'px;--r:' + Math.round(Math.random() * 720 - 360) + 'deg;border-radius:' + (i % 3 ? '4px' : '50%') + '"></i>';
  }
  var el = document.createElement('div');
  el.className = 'pop k-' + o.kind;
  el.style.cssText = '--c1:' + k.c1 + ';--c2:' + k.c2;
  el.innerHTML =
    '<svg class="lines" viewBox="0 0 1920 1080">' + POP_LINES + '</svg>' +
    '<div class="band"></div>' +
    '<div class="portal">' + popPortalSVG() + '</div>' +
    '<div class="actor">' +
      '<div class="card"><div class="tag">' + popEsc(o.tag || k.tag) + '</div>' +
        '<div class="ttl">' + (o.code ? '<b>' + popEsc(o.code) + '</b>' : '') + popEsc(o.title) + '</div>' +
        '<div class="sub">' + popEsc(o.sub) + '</div></div>' +
      '<div class="burst"><svg viewBox="0 0 260 260"><g class="rays"><polygon points="' + POP_BURST + '" fill="' + k.c1 + '" stroke="#0a0f2e" stroke-width="7" stroke-linejoin="round"/></g>' +
        '<circle cx="130" cy="130" r="70" fill="#ffd166" stroke="#0a0f2e" stroke-width="6"/></svg><b>' + popEsc(o.burst || k.burst) + '</b></div>' +
      '<div class="bot"><div class="bob">' + popBotSVG() + '</div></div>' +
      '<div class="sparks">' + sparks + '</div>' +
    '</div>' +
    '<div class="flash"></div>';
  document.getElementById('stage').appendChild(el);
  // pull the page toward the portal (restart the animation every pop)
  var world = document.getElementById('world'), vig = document.getElementById('vig');
  world.classList.remove('warp'); vig.classList.remove('on'); void world.offsetWidth;
  if (P.get('warp') !== '0') { world.classList.add('warp'); vig.classList.add('on'); }
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); world.classList.remove('warp'); vig.classList.remove('on'); nextPop(); }, POP_MS);
}

/* ===== lab controls + demo loop ===== */
var SAMPLES = {
  done:     { kind: 'done',     code: 'M12', title: 'ไม่ค่อยเต็ม',      sub: 'BIG ASS ก่อนตาย · เยี่ยมมาก LITTLE 🎉' },
  urgent:   { kind: 'urgent',   code: 'M27', title: 'เรา',              sub: 'ลูกค้ารอดูก่อน 5 โมงเย็น · KWANG ทำก่อนเลย!' },
